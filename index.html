<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aspirasi Class Meet</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7fb;--card:#fff;--tx:#1c2033;--mu:#667085;--pr:#4f46e5;--prt:#fff;--ok:#16a34a;--bd:#e3e6ef;--wa:#d97706}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141f;--card:#1b1e2e;--tx:#eceefa;--mu:#9aa1ba;--pr:#818cf8;--prt:#12141f;--bd:#2b2f45;--ok:#4ade80;--wa:#fbbf24}}
:root[data-theme="dark"]{--bg:#12141f;--card:#1b1e2e;--tx:#eceefa;--mu:#9aa1ba;--pr:#818cf8;--prt:#12141f;--bd:#2b2f45;--ok:#4ade80;--wa:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:1.6rem;margin:8px 0}h2{font-size:1.2rem;margin:4px 0 8px}
.mu{color:var(--mu);font-size:.92rem}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.lomba{display:flex;gap:12px;align-items:flex-start;cursor:pointer;width:100%;text-align:left;color:inherit;font:inherit}
.lomba.on{border-color:var(--pr);box-shadow:0 0 0 2px var(--pr) inset}
.lomba .e{font-size:1.7rem}.lomba b{display:block}
.chk{margin-left:auto;font-size:1.3rem;color:var(--pr)}
input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0 10px}
button.p,button.s{border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:600;cursor:pointer}
button.p{background:var(--pr);color:var(--prt)}button.p:disabled{opacity:.4;cursor:not-allowed}
button.s{background:transparent;color:var(--pr);border:1.5px solid var(--pr)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:space-between}
.cnt{font-weight:700}.cnt.ok{color:var(--ok)}.cnt.no{color:var(--wa)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.err{color:var(--wa);font-weight:600}
.br{height:20px;border-radius:6px;background:var(--pr);min-width:2px}
.bl{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:.9rem}.bl span:first-child{flex:0 0 46%}
.sc{overflow-x:auto}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:2px 10px;margin:2px;font-size:.85rem}
</style>
</head>

<main id="app"></main>

  var h="";
  if(s.step==0){
    h='<div style="text-align:center;margin:8px 0 4px"><img src="'+LOGO+'" alt="Logo SMA Negeri 1 Pronojiwo" style="width:110px;max-width:40%;height:auto"><div class="mu" style="font-weight:600;margin-top:6px">SMA Negeri 1 Pronojiwo</div></div><h1 style="text-align:center">Aspirasi Class Meet 🎉</h1><p class="mu">Suaramu menentukan lomba yang akan dipertandingkan. Pilih <b>'+MIN+'–'+MAX+' lomba</b> favoritmu. Kalau lomba yang kamu mau belum ada, kamu bisa menambahkannya sendiri.</p>'+
    '<div class="card"><label>Nama</label><input id="nama" value="'+esc(s.nama)+'" placeholder="Nama lengkap" autocomplete="off">'+
    '<label>Kelas</label><select id="kelas"><option value="">— pilih kelas —</option>'+KELAS.map(function(k){return '<option'+(s.kelas==k?' selected':'')+'>'+k+'</option>'}).join('')+'</select></div>'+
    '<div class="err">'+esc(s.err)+'</div>'+(s.dupe?'<div class="card err">Kamu sudah pernah mengisi. Terima kasih!</div>':'')+
    (s.db===null&&s.uid===null?'<p class="mu">Catatan: sambungan ke panitia belum tersedia, jawabanmu akan disimpan di perangkat ini dan bisa disalin.</p>':'')+
    (s.admin?'<button class="s" onclick="dash()">Dashboard Panitia</button>':'')+
    bar(null,"Mulai",false,"start()");
  } else if(s.step==1){
    var t=total(),ok=t>=MIN&&t<=MAX;
    h='<h2>Pilih lombamu</h2><p class="mu">Ketuk kartu untuk memilih. Total pilihan (bawaan + usulanmu) harus '+MIN+'–'+MAX+'.</p>';
    L.forEach(function(x){var on=s.pick.indexOf(x.id)>-1;
      h+='<button class="card lomba'+(on?' on':'')+'" onclick="tog('+x.id+')"><span class="e">'+x.e+'</span><span><b>'+esc(x.n)+'</b><span class="mu">'+esc(x.d)+'</span></span><span class="chk">'+(on?'✔':'')+'</span></button>'});
    h+='<div class="err">'+esc(s.err)+'</div>';
    var need=MIN-t;
    h+='<div class="card"><b>➕ Tambah lomba lain</b><p class="mu">'+(need>0?'Kurang '+need+' lagi? Usulkan lomba yang kamu inginkan.':'Ada lomba lain yang kamu mau?')+'</p>';
    s.usul.forEach(function(u,i){h+='<div class="tag">'+esc(u.n)+' <a href="#" onclick="rmU('+i+');return false">✕</a></div>'});
    h+='<input id="un" placeholder="Nama lomba, contoh: Basket 3x3"><input id="ua" placeholder="Alasan singkat (opsional)"><button class="s" onclick="addU()">Tambahkan usulan</button></div>';
    h+='<div class="bar"><button class="s" onclick="sync();go(0)">Kembali</button><span class="cnt '+(ok?'ok':'no')+'">'+t+'/'+MIN+' min, maks '+MAX+'</span><button class="p" '+(ok?'':'disabled')+' onclick="go(2)">Lanjut</button></div>';
  } else if(s.step==2){
    h='<h2>Menu Ganti Lomba</h2><p class="mu">Panitia sedang mempertimbangkan mengganti lomba di bawah ini. Pendapatmu?</p>';
    SWAP.forEach(function(id){var x=ln(id),g=s.ganti[id]||{};
      h+='<div class="card"><b>'+x.e+' '+esc(x.n)+'</b><div class="row" style="margin:10px 0"><button class="'+(g.k=="tetap"?'p':'s')+'" onclick="gk('+id+',\'tetap\')">Pertahankan</button><button class="'+(g.k=="ganti"?'p':'s')+'" onclick="gk('+id+',\'ganti\')">Ganti</button></div>';
      if(g.k=="ganti"){h+='<label class="mu">Diganti dengan:</label><select onchange="gp('+id+',this.value)"><option value="">— pilih rekomendasi —</option>'+
        REKOM.map(function(r){return '<option'+(g.p==r?' selected':'')+'>'+esc(r)+'</option>'}).join('')+'<option value="__sendiri"'+(g.p=="__sendiri"?' selected':'')+'>Usul sendiri…</option></select>';
        if(g.p=="__sendiri")h+='<input placeholder="Tulis lomba penggantinya" value="'+esc(g.o||"")+'" oninput="go2('+id+',this.value)">'}
      h+='</div>'});
    var done=SWAP.every(function(id){var g=s.ganti[id];return g&&(g.k=="tetap"||(g.p&&(g.p!="__sendiri"||(g.o||"").trim())))});
    h+='<div class="err">'+esc(s.err)+'</div>'+bar(1,"Lanjut",!done,"go(3)");
  } else if(s.step==3){
    h='<h2>Periksa pilihanmu</h2><div class="card"><b>'+esc(s.nama)+'</b> · '+esc(s.kelas)+'</div><div class="card"><b>Lomba pilihan ('+total()+')</b><br>';
    s.pick.forEach(function(id){h+='<span class="tag">'+ln(id).e+' '+esc(ln(id).n)+'</span>'});
    s.usul.forEach(function(u){h+='<span class="tag">✨ '+esc(u.n)+' (usulan)</span>'});
    h+='</div><div class="card"><b>Ganti lomba</b>';
    SWAP.forEach(function(id){var g=s.ganti[id];h+='<div>'+esc(ln(id).n)+': '+(g.k=="tetap"?'Dipertahankan':'Diganti → '+esc(g.p=="__sendiri"?g.o:g.p))+'</div>'});
    h+='</div><div class="err">'+esc(s.err)+'</div>'+bar(2,"Kirim aspirasi",false,"submit()");
  } else if(s.step==4){
    h='<h1>Terima kasih! 🙌</h1><p>Aspirasimu sudah '+(s.saved?'terkirim ke panitia.':'disimpan di perangkat ini.')+'</p>';
    if(!s.saved)h+='<p class="mu">Sambungan ke panitia belum tersedia. Salin ringkasan di bawah dan kirim ke panitia MPK.</p><textarea id="sm" rows="8" readonly>'+esc(summary())+'</textarea><button class="p" onclick="$(\'sm\').select();document.execCommand(\'copy\')">Salin ringkasan</button>';
  } else if(s.step==5){ h=dashHtml() }
  $("app").innerHTML=h;
}
// ===== AKSI =====
function start(){sync();if(!s.nama.trim()||!s.kelas.trim()){s.err="Isi nama dan kelas dulu ya.";render();return}go(1)}
function tog(id){var i=s.pick.indexOf(id);if(i>-1)s.pick.splice(i,1);else{if(total()>=MAX){s.err="Maksimal "+MAX+" pilihan. Batalkan salah satu dulu.";render();return}s.pick.push(id)}s.err="";render()}
function addU(){var n=($("un").value||"").trim(),a=($("ua").value||"").trim();
  if(!n){return}
  var dup=L.filter(function(x){return x.n.toLowerCase()==n.toLowerCase()})[0];
  if(dup){s.err="“"+dup.n+"” sudah ada di daftar, pilih saja kartunya.";render();return}
  if(total()>=MAX){s.err="Maksimal "+MAX+" pilihan.";render();return}
  s.usul.push({n:n,a:a});s.err="";render()}
function rmU(i){s.usul.splice(i,1);render()}
function gk(id,k){s.ganti[id]={k:k};render()}
function gp(id,v){s.ganti[id].p=v;render()}
function go2(id,v){s.ganti[id].o=v;var d=SWAP.every(function(i){var g=s.ganti[i];return g&&(g.k=="tetap"||(g.p&&(g.p!="__sendiri"||(g.o||"").trim())))});document.querySelector(".bar .p").disabled=!d}
function payload(){return{nama:s.nama.trim(),kelas:s.kelas.trim(),pick:s.pick,usul:s.usul,ganti:s.ganti,t:Date.now()}}
function summary(){var p=payload();return "ASPIRASI CLASS MEET\n"+p.nama+" - "+p.kelas+"\nLomba: "+p.pick.map(function(i){return ln(i).n}).concat(p.usul.map(function(u){return u.n+" (usulan)"})).join(", ")+"\nGanti lomba: "+SWAP.map(function(i){var g=p.ganti[i];return ln(i).n+" = "+(g.k=="tetap"?"pertahankan":"ganti -> "+(g.p=="__sendiri"?g.o:g.p))}).join("; ")}
async function submit(){
  var p=payload();
  if(s.db&&s.uid){
    try{await s.db.collection("responses").doc(s.uid).set(p);s.saved=true}catch(e){s.err="Gagal mengirim ke panitia. Jawabanmu disimpan di perangkat ini.";}
  }
  try{localStorage.setItem("aspirasi-classmeet",JSON.stringify(p))}catch(e){}
  go(4)
}
// ===== DASHBOARD =====
var rows=[];
async function dash(){
  try{var q=await s.db.collection("responses").get();rows=q.docs.map(function(d){return d.data()})}catch(e){rows=[]}
  s.step=5;render()
}
function dashHtml(){
  var c={};L.forEach(function(x){c[x.id]=0});var us={};
  rows.forEach(function(r){(r.pick||[]).forEach(function(i){c[i]=(c[i]||0)+1});(r.usul||[]).forEach(function(u){var k=u.n.trim().toLowerCase();us[k]=us[k]||{n:u.n,c:0};us[k].c++})});
  var mx=Math.max(1,Math.max.apply(null,Object.keys(c).map(function(k){return c[k]})));
  var h='<h2>Dashboard Panitia</h2><p class="mu">'+rows.length+' responden</p><div class="card"><b>Peringkat lomba</b>';
  Object.keys(c).sort(function(a,b){return c[b]-c[a]}).forEach(function(i){h+='<div class="bl"><span>'+esc(ln(i).n)+'</span><div class="br" style="width:'+(c[i]/mx*45)+'%"></div><b>'+c[i]+'</b></div>'});
  h+='</div><div class="card"><b>Hasil menu ganti lomba</b>';
  SWAP.forEach(function(id){var t=0,g=0,pr={};rows.forEach(function(r){var x=r.ganti&&r.ganti[id];if(!x)return;if(x.k=="ganti"){g++;var n=x.p=="__sendiri"?x.o:x.p;pr[n]=(pr[n]||0)+1}else t++});
    h+='<p><b>'+esc(ln(id).n)+'</b>: Pertahankan '+t+' · Ganti '+g+'<br>'+Object.keys(pr).sort(function(a,b){return pr[b]-pr[a]}).map(function(n){return '<span class="tag">'+esc(n)+' ('+pr[n]+')</span>'}).join('')+'</p>'});
  h+='</div><div class="card"><b>Usulan lomba baru</b><br>'+(Object.keys(us).length?Object.keys(us).sort(function(a,b){return us[b].c-us[a].c}).map(function(k){return '<span class="tag">'+esc(us[k].n)+' ('+us[k].c+')</span>'}).join(''):'<span class="mu">Belum ada.</span>')+'</div>';
  h+='<div class="row"><button class="s" onclick="go(0)">Kembali</button><button class="p" onclick="csv()">Unduh CSV</button></div>';
  return h
}
async function csv(){
  var e=function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'};
  var out=["Nama,Kelas,Lomba pilihan,Usulan,Ganti lomba"];
  rows.forEach(function(r){out.push([r.nama,r.kelas,(r.pick||[]).map(function(i){return ln(i).n}).join("; "),(r.usul||[]).map(function(u){return u.n}).join("; "),JSON.stringify(r.ganti||{})].map(e).join(","))});
  try{var d=await claude.use("downloads");if(d)await d.save({filename:"aspirasi-classmeet.csv",data:out.join("\n")})}catch(x){}
}
// ===== INIT =====
render();
(async function(){
  try{
    var u=await claude.use("user"),db=await claude.use("db");
    if(u&&db){s.uid=String(await u.id());s.db=db;s.admin=!!(u.canEdit&&u.canEdit());
      try{var d=await db.doc("responses/"+s.uid).get();if(d.exists){s.dupe=true}}catch(e){}
      if(s.step==0)render()}
  }catch(e){}
})();
</script>
</body>
</html>
